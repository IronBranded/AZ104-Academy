name: Outline drift

# The one check this whole project is organised around, and the only one that
# currently depends on someone remembering to run it.
#
# Two polls, one weekly job, one issue:
#
#   1. The skills-measured outline, diffed against docs/SKILLS-MEASURED-SNAPSHOT.md.
#      Only the "## Skills measured" section is compared - the snapshot's front
#      matter carries git_commit_id, updated_at, word_count and a content hash,
#      all of which change when Microsoft edits anything on the page, including
#      a link in the study-resources table. Diffing the whole file produces
#      alerts that are not skills changes, and an alert you learn to ignore is
#      worse than no alert.
#
#   2. The official training the guide links to: every learning path (title and
#      exact module list) and every lab in content/official-training.json,
#      checked against Microsoft's public Learn source (MicrosoftDocs/learn) and
#      the lab repository. Added after the
#      course was published unnoticed - the first two polls watch only the
#      certification page, not the training catalogue.

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the live outline against the snapshot
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The study guide URL is exam data, read from data/exam.js.
          $examJs   = Get-Content -LiteralPath './data/exam.js' -Raw
          $guideUrl = ([regex]::Match($examJs, "studyGuide:\s*'([^']+)'")).Groups[1].Value + '?accept=text/markdown'
          if (-not $guideUrl.StartsWith('https://')) { throw 'studyGuide not found in data/exam.js' }
          $headers  = @{ 'User-Agent' = 'academy-outline-drift-check' }

          function Get-SkillsSection {
              param([string] $Text)

              $lines = $Text -split "`r?`n"
              $start = ($lines | Select-String -SimpleMatch '## Skills measured' | Select-Object -First 1).LineNumber
              $end   = ($lines | Select-String -SimpleMatch '## Study resources' | Select-Object -First 1).LineNumber

              if (-not $start) {
                  throw 'Could not locate "## Skills measured". The page shape changed, which is itself drift worth looking at.'
              }
              if (-not $end -or $end -le $start) { $end = $lines.Count + 1 }

              # Trim, drop blank lines, and rejoin wrapped lines onto the line
              # they continue, so reflowed text is not reported as a change.
              # Bullet text is what matters, not where it breaks.
              $out = [System.Collections.Generic.List[string]]::new()
              foreach ($l in $lines[($start - 1)..($end - 2)]) {
                  $t = $l.Trim()
                  if ($t -eq '') { continue }
                  $isStart = $t -match '^(#|-\s|\*\s|\||\d+\.\s)'
                  if (-not $isStart -and $out.Count -gt 0 -and $out[$out.Count - 1] -notmatch '^#') {
                      $out[$out.Count - 1] = $out[$out.Count - 1] + ' ' + $t
                  } else { $out.Add($t) }
              }
              return @($out)
          }

          $live     = (Invoke-WebRequest -Uri $guideUrl -UseBasicParsing -Headers $headers).Content
          $snapshot = Get-Content -LiteralPath './docs/SKILLS-MEASURED-SNAPSHOT.md' -Raw

          $a = Get-SkillsSection -Text $snapshot
          $b = Get-SkillsSection -Text $live

          $delta   = Compare-Object -ReferenceObject $a -DifferenceObject $b
          $changed = $false
          $report  = [System.Collections.Generic.List[string]]::new()

          if ($delta) {
              $changed = $true
              $report.Add('## The skills-measured outline has changed')
              $report.Add('')
              $report.Add('`- snapshot` is what the repository believes. `+ live` is what Microsoft publishes now.')
              $report.Add('')
              $report.Add('```diff')
              foreach ($d in $delta) {
                  $mark = if ($d.SideIndicator -eq '=>') { '+ live    ' } else { '- snapshot' }
                  $report.Add("$mark $($d.InputObject)")
              }
              $report.Add('```')
              $report.Add('')
              $report.Add('### What to update, in one commit')
              $report.Add('')
              $report.Add('1. The affected module''s `sub_objectives` in its front matter, **and** its `## Sub-objectives covered` list.')
              $report.Add('2. `content/manifest.json`, if a module''s scope changed.')
              $report.Add('3. `data/objectives/*.json`: a new bullet gets a new semantic id and a planned module; an id is never reused.')
              $report.Add('4. `docs/SKILLS-MEASURED-SNAPSHOT.md` itself.')
              $report.Add('5. A quiz question for any genuinely new bullet - the coverage check will flag it otherwise.')
              $report.Add('')
              $report.Add('Then bump `last_verified` on every module you touched.')
              $report.Add('')
          }
          else {
              Write-Host 'Skills-measured section: no change.'
          }

          # --- second poll: the official training this guide links to -------
          # Every learning path in content/official-training.json is checked
          # against Microsoft's public Learn source, which is plain YAML and
          # does not depend on scraping a rendered page.
          $training = Get-Content -LiteralPath './content/official-training.json' -Raw | ConvertFrom-Json
          $found = [System.Collections.Generic.List[string]]::new()

          foreach ($p in $training.paths) {
              $slug = ($p.url.TrimEnd('/') -split '/')[-1]
              $src  = "https://raw.githubusercontent.com/MicrosoftDocs/learn/main/learn-pr/paths/$slug/index.yml"
              try   { $yml = (Invoke-WebRequest -Uri $src -UseBasicParsing -Headers $headers).Content }
              catch { $found.Add("- **$($p.title)** - the path definition is gone ($src): renamed or retired."); continue }

              $title = ''
              if ($yml -match '(?m)^title:\s*(.+?)\s*$') { $title = $Matches[1].Trim([char]39, [char]34) }
              # Read the modules: list itself - uids do not share one prefix.
              $uids = @()
              if ($yml -match '(?ms)^modules:[ \t]*\r?\n((?:[ \t]*-[ \t]*\S[^\r\n]*\r?\n?)+)') {
                  $uids = @([regex]::Matches($Matches[1], '(?m)^[ \t]*-[ \t]+(\S+)') | ForEach-Object { $_.Groups[1].Value.Trim([char]39, [char]34) })
              }
              $modules = $uids.Count
              # Compare the exact module list, not just its length: a module swapped
              # for another keeps the count and changes what the lesson links to.
              if ($p.module_list) {
                  $recorded = @($p.module_list | ForEach-Object { $_.uid })
                  $added   = @($uids | Where-Object { $_ -notin $recorded })
                  $removed = @($recorded | Where-Object { $_ -notin $uids })
                  if ($added)   { $found.Add("- **$($p.title)** - module(s) added: $($added -join ', ').") }
                  if ($removed) { $found.Add("- **$($p.title)** - module(s) removed: $($removed -join ', ').") }
              }

              if ($title -ne $p.title) { $found.Add("- **$($p.title)** - title is now '$title'.") }
              if ($modules -ne $p.modules) { $found.Add("- **$($p.title)** - $($p.modules) modules recorded, $modules now.") }
          }

          foreach ($l in $training.labs) {
              $raw = $l.url -replace '^https://github.com/([^/]+/[^/]+)/blob/', 'https://raw.githubusercontent.com/$1/'
              try   { $null = Invoke-WebRequest -Uri $raw -UseBasicParsing -Headers $headers -Method Head }
              catch { $found.Add("- **Lab $($l.id): $($l.title)** - the lab file is gone ($($l.url)).") }
          }

          if ($found.Count -gt 0) {
              $changed = $true
              $report.Add('## Official training linked from the guide has changed')
              $report.Add('')
              $report.AddRange($found)
              $report.Add('')
              $report.Add('Update `content/official-training.json` and its `verified` date. The guide joins it to objectives by heading text, so a stale entry shows under "Needs maintainer review" on the coverage page.')
              $report.Add('')
          }
          else {
              Write-Host "Official training: $($training.paths.Count) paths and $($training.labs.Count) labs unchanged."
          }

          if ($changed) {
              $report.Add('---')
              $report.Add('')
              $report.Add("_Raised automatically by ``.github/workflows/outline-drift.yml`` on $(Get-Date -Format 'yyyy-MM-dd')._")
              $report -join "`n" | Set-Content -Path 'drift-report.md' -Encoding utf8
          }

          "changed=$($changed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Open or update the drift issue
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('drift-report.md', 'utf8');
            const { owner, repo } = context.repo;

            // One open issue at a time. A second change while the first is
            // unresolved becomes a comment, so the history stays in one place.
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'outline-drift'
            });

            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body
              });
              core.notice(`Commented on existing issue #${open.data[0].number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo,
                title: 'the exam certification surface has changed',
                body,
                labels: ['outline-drift']
              });
              core.notice(`Opened issue #${created.data.number}.`);
            }
